<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>財經 Dashboard</title>
<style>
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --muted:        #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --series:       #2a78d6;
  --up:           #006300;
  --down:         #d03b3b;
  --warn:         #fab219;
  --border:       rgba(11,11,11,0.10);
  --radius:       14px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:   #0d0d0d;
    --surface: #1a1a19;
    --ink:     #ffffff;
    --ink-2:   #c3c2b7;
    --muted:   #898781;
    --grid:    #2c2c2a;
    --axis:    #383835;
    --series:  #3987e5;
    --up:      #0ca30c;
    --down:    #d03b3b;
    --border:  rgba(255,255,255,0.10);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:   #0d0d0d;
  --surface: #1a1a19;
  --ink:     #ffffff;
  --ink-2:   #c3c2b7;
  --muted:   #898781;
  --grid:    #2c2c2a;
  --axis:    #383835;
  --series:  #3987e5;
  --up:      #0ca30c;
  --down:    #d03b3b;
  --border:  rgba(255,255,255,0.10);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 28px 56px;
  background: var(--plane);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: min(1040px, 100%); margin: 0 auto; display: grid; gap: 16px; }
/* #metrics 原本也掛 .wrap，變成巢狀。grid 項目一旦帶 auto 邊距就會收縮成
   內容寬度而不是撐滿，導致它比其他區塊窄。改用不帶寬度限制的 stack。 */
.stack { display: grid; gap: 16px; }

header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.stamp { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }

button {
  font: inherit; font-size: 13px;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--axis); }
button:disabled { opacity: .5; cursor: progress; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

.label { font-size: 13px; color: var(--ink-2); }
.sub   { font-size: 12px; color: var(--muted); }

/* hero -------------------------------------------------------------- */
.hero .big { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; }
.hero .legs { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 14px; }
.hero .leg .v { font-size: 19px; font-weight: 600; }

.up { color: var(--up); }
.down { color: var(--down); }

/* dealer cards ------------------------------------------------------ */
.price { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 0; }
.alt   { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
/* 兩張幣商卡的說明行數不一樣（truney 多一行），狀態列若跟著內容浮動就會
   一高一低。卡片改成 flex column，狀態列用 auto 邊距壓到底部對齊。 */
#dealers .card { display: flex; flex-direction: column; }
.rowend {
  display: flex; align-items: center; gap: 8px;
  margin-top: auto; padding-top: 14px; flex-wrap: wrap;
  /* 固定高度：左卡沒有按鈕、右卡有，靠內容自然高度會差一截，
     兩張卡的狀態列就一高一低。給定高度才會真正對齊。 */
  height: 46px; box-sizing: content-box;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok    { background: var(--up); }
.dot.stale { background: var(--warn); }
.dot.bad   { background: var(--down); }

/* charts ------------------------------------------------------------ */
.metric-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.metric-head .now { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
/* 亮黃色在淺色底上對比只有 1.79:1，小字大字都不合格，
   所以淺色模式改用同色系的深琥珀，深色模式才用亮黃。 */
.metric-head .label.accent { color: #a06400; }  /* 13px 一般文字需 4.5:1；#a86a00 只有 4.33 */
/* 名稱長度不一（「金價現貨」vs「VOO」）會讓價格左右飄，
   給一個最小寬度，四張卡的價格就落在同一條垂直線上。 */
.metric-head .label { min-width: 92px; display: inline-block; }
@media (max-width: 720px) { .metric-head .label { min-width: 0; } }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .metric-head .label.accent { color: #fab219; }
}
:root[data-theme="dark"] .metric-head .label.accent { color: #fab219; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
@media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
.chart { position: relative; }
.chart h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
svg { display: block; width: 100%; height: 132px; overflow: visible; touch-action: none; }
.tip {
  position: absolute; pointer-events: none; opacity: 0;
  transform: translate(-50%, -100%);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 9px; font-size: 12px; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.14);
  transition: opacity .08s;
}
.tip .t-d { color: var(--muted); font-size: 11px; }

/* 本益比 */
.pe .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; }
.pe .why { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 10px; }
.pe .why b { color: var(--ink-2); font-weight: 600; }

/* heatmap links ----------------------------------------------------- */
a.tile {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  text-decoration: none; color: inherit;
}
a.tile:hover { border-color: var(--axis); }
a.tile .arrow { color: var(--muted); font-size: 20px; }

/* 指點模式 ---------------------------------------------------------- */
body.pick [data-id] { cursor: crosshair; }
body.pick [data-id]:hover {
  outline: 2px solid var(--series);
  outline-offset: 2px;
  border-radius: 4px;
}
body.pick [data-id]:hover::after {
  content: attr(data-id);
  position: absolute; z-index: 40;
  transform: translate(4px, -100%);
  background: var(--series); color: #fff;
  font: 600 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 2px 6px; border-radius: 4px; white-space: nowrap;
  pointer-events: none;
}
body.pick [data-id] { position: relative; }
#pickbar {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 50; display: none; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 13px;
  box-shadow: 0 6px 24px rgba(0,0,0,.22);
}
body.pick #pickbar { display: flex; }
#pickbar code {
  font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--plane); padding: 2px 6px; border-radius: 4px;
}

/* 意見輸入框 */
#notebox {
  position: fixed; z-index: 60; display: none; width: 340px;
  background: var(--surface); border: 1px solid var(--series);
  border-radius: 10px; padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
}
#notebox.on { display: block; }
#notebox .tgt {
  font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #fff; background: var(--series);
  padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px;
}
#notebox textarea {
  width: 100%; min-height: 68px; resize: vertical;
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--plane); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px;
}
#notebox textarea:focus { outline: 2px solid var(--series); outline-offset: -1px; }
#notebox .actions {
  display: flex; align-items: center; gap: 8px; margin-top: 8px;
}
#notecount {
  background: var(--series); color: #fff; border: none;
  font-size: 12px; font-weight: 600;
}
#notecount:hover { filter: brightness(1.1); }
#notelist {
  margin-top: 10px; display: none; border-top: 1px solid var(--border);
  padding-top: 10px; max-height: 260px; overflow-y: auto;
}
#notelist.on { display: block; }
#notelist .n {
  display: grid; grid-template-columns: 62px 150px 1fr auto;
  gap: 10px; padding: 6px 0; font-size: 13px; align-items: baseline;
  border-bottom: 1px solid var(--border);
}
#notelist .n:last-child { border-bottom: none; }
#notelist .n code {
  font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink-2);
}
#notelist .st { font-size: 11px; font-weight: 600; }
#notelist .st.open { color: var(--warn); }
#notelist .st.done { color: var(--up); }
#notelist .n.done .tx { color: var(--muted); }
#notelist .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
#notelist .hint {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted); line-height: 1.6;
}

footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
footer code { font-size: 11px; }
.err { color: var(--down); }
.empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header data-id="header">
    <h1>財經 Dashboard</h1>
    <span class="stamp" id="stamp"></span>
    <span class="spacer"></span>
    <button id="notecount" style="display:none"></button>
    <button id="btn-all" title="含 truney：會重新整理你開著的 truney 分頁">全部更新（含 truney）</button>
  </header>
  <div id="notelist"></div>

  <section class="card hero" id="hero" data-id="hero"></section>
  <section class="grid-2" id="dealers"></section>
  <section id="metrics" class="stack"></section>
  <section class="grid-3" id="pe"></section>
  <section class="grid-2" id="heatmaps"></section>
  <footer id="foot" data-id="footer"></footer>
</div>

<div id="pickbar">
  <span>指點模式</span>
  <span class="sub">點任一區塊寫意見</span>
  <span id="pickmsg"></span>
  <span class="sub">按 <code>D</code> 離開</span>
</div>

<div id="notebox">
  <span class="tgt" id="note-target"></span>
  <textarea id="note-text" placeholder="這一塊想怎麼改？例如：圖太矮，拉高一點"></textarea>
  <div class="actions">
    <button id="note-send">送出</button>
    <span class="sub">⌘↵ 送出 · Esc 取消</span>
  </div>
</div>

<script src="data.js"></script>
<script>
const D = window.DASH || null;

/* ---------- 格式 ---------- */
const nf = (v, dp = 0) => v == null || Number.isNaN(v)
  ? "—"
  : v.toLocaleString("zh-TW", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const twd = v => "NT$" + nf(v);
const cad = v => "C$" + nf(v);
const usd = v => "US$" + nf(v, 2);

function hoursSince(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return Number.isNaN(t) ? null : (Date.now() - t) / 36e5;
}
function ago(iso) {
  const h = hoursSince(iso);
  if (h == null) return "時間不明";
  if (h < 1) return Math.max(1, Math.round(h * 60)) + " 分鐘前";
  if (h < 24) return Math.round(h) + " 小時前";
  return Math.round(h / 24) + " 天前";
}

/* ---------- 折線圖：單一資料列，2px 線、淡格線、hover 十字線 ---------- */
function lineChart(points, fmt, liveLast) {
  const box = document.createElement("div");
  box.className = "chart";
  if (!points || points.length < 2) {
    box.innerHTML = '<div class="empty">資料不足</div>';
    return box;
  }

  const W = 320, H = 132, PAD_L = 6, PAD_R = 6, PAD_T = 12, PAD_B = 20;
  const vals = points.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo;
  lo -= span * 0.12; hi += span * 0.12;

  const x = i => PAD_L + (i / (points.length - 1)) * (W - PAD_L - PAD_R);
  const y = v => PAD_T + (1 - (v - lo) / (hi - lo)) * (H - PAD_T - PAD_B);

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");

  // 三條淡格線，純粹當背景刻度用，不標數字避免視覺噪音
  for (let k = 0; k <= 2; k++) {
    const gy = PAD_T + (k / 2) * (H - PAD_T - PAD_B);
    const g = document.createElementNS(svgns, "line");
    g.setAttribute("x1", 0); g.setAttribute("x2", W);
    g.setAttribute("y1", gy); g.setAttribute("y2", gy);
    g.setAttribute("stroke", "var(--grid)");
    g.setAttribute("stroke-width", "1");
    g.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(g);
  }

  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(2)},${y(p.v).toFixed(2)}`).join("");
  const path = document.createElementNS(svgns, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "var(--series)");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(path);

  // 起訖日期
  const mkTick = (txt, px, anchor) => {
    const t = document.createElementNS(svgns, "text");
    t.setAttribute("x", px); t.setAttribute("y", H - 4);
    t.setAttribute("fill", "var(--muted)");
    t.setAttribute("font-size", "10");
    t.setAttribute("text-anchor", anchor);
    t.textContent = txt;
    return t;
  };
  // 跨年的區間（近 1 年）只標 MM-DD 的話兩端會長得一樣，要帶上年份
  const firstD = points[0].d, lastD = points[points.length - 1].d;
  const spanDays = (Date.parse(lastD) - Date.parse(firstD)) / 864e5;
  const tick = x => (spanDays > 180 ? x.slice(2, 7) : x.slice(5));
  svg.appendChild(mkTick(tick(firstD), 0, "start"));
  svg.appendChild(mkTick(tick(lastD), W, "end"));

  // 最後一點是盤中即時價時標一個點，跟已收盤的線做出區別
  if (liveLast) {
    const li = points.length - 1;
    const lp = document.createElementNS(svgns, "circle");
    lp.setAttribute("cx", x(li));
    lp.setAttribute("cy", y(points[li].v));
    lp.setAttribute("class", "livedot");   // 跟 hover 用的圓點區分開
    lp.setAttribute("r", "3.5");
    lp.setAttribute("fill", "var(--series)");
    lp.setAttribute("stroke", "var(--surface)");
    lp.setAttribute("stroke-width", "2");
    svg.appendChild(lp);
  }

  // hover 層
  const cross = document.createElementNS(svgns, "line");
  cross.setAttribute("stroke", "var(--axis)");
  cross.setAttribute("stroke-width", "1");
  cross.setAttribute("vector-effect", "non-scaling-stroke");
  cross.setAttribute("y1", PAD_T); cross.setAttribute("y2", H - PAD_B);
  cross.style.opacity = 0;
  svg.appendChild(cross);

  const dot = document.createElementNS(svgns, "circle");
  dot.setAttribute("r", "4");
  dot.setAttribute("fill", "var(--series)");
  dot.setAttribute("stroke", "var(--surface)");
  dot.setAttribute("stroke-width", "2");
  dot.style.opacity = 0;
  svg.appendChild(dot);

  const tip = document.createElement("div");
  tip.className = "tip";
  box.appendChild(svg);
  box.appendChild(tip);

  function move(ev) {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    let i = Math.round(((px - PAD_L) / (W - PAD_L - PAD_R)) * (points.length - 1));
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.v));
    cross.style.opacity = 1; dot.style.opacity = 1;
    tip.innerHTML = `<div>${fmt(p.v)}</div><div class="t-d">${p.d}</div>`;
    tip.style.left = (x(i) / W) * r.width + "px";
    tip.style.top = (y(p.v) / H) * r.height - 8 + "px";
    tip.style.opacity = 1;
  }
  function leave() { cross.style.opacity = 0; dot.style.opacity = 0; tip.style.opacity = 0; }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", leave);

  return box;
}

/* ---------- 區塊 ---------- */
function metricBlock(key, title, series, fmt, note, windows, accent) {
  const card = document.createElement("section");
  card.className = "card";
  card.dataset.id = "metric:" + key;
  const pts = series && series.points || [];
  const last = pts[pts.length - 1];
  const prev = pts[pts.length - 2];
  let delta = "";
  if (last && prev) {
    const dv = last.v - prev.v;
    const pc = (dv / prev.v) * 100;
    const cls = dv >= 0 ? "up" : "down";
    delta = `<span class="${cls}">${dv >= 0 ? "▲" : "▼"} ${fmt(Math.abs(dv))} (${pc >= 0 ? "+" : "−"}${Math.abs(pc).toFixed(2)}%)</span>`;
  }
  card.innerHTML = `
    <div class="metric-head">
      <span class="label${accent ? " accent" : ""}">${title}</span>
      <span class="now" data-role="now">${last ? fmt(last.v) : "—"}</span>
      <span data-role="delta">${delta}</span>
      <span class="sub" data-role="asof">${last ? last.d + " 收盤" : ""}</span>
      <span class="spacer"></span>
      <span class="sub">${note || ""}</span>
    </div>`;
  const wins = windows || [["近 1 個月", "1M"], ["近 3 個月", "3M"]];
  const charts = document.createElement("div");
  charts.className = "charts";
  charts.style.gridTemplateColumns = `repeat(${wins.length}, 1fr)`;
  card.appendChild(charts);

  // 記在卡片上，之後拿到盤中價可以帶著 extra 重畫
  card._draw = extra => {
    charts.innerHTML = "";
    wins.forEach(([lab, win]) => {
      let pts = (series && series[win]) || [];
      if (extra) {
        // 同一天已經有點就換掉（收盤後），沒有就接在後面（盤中）
        pts = pts.filter(p => p.d !== extra.d).concat([extra]);
      }
      const col = document.createElement("div");
      col.dataset.id = `chart:${key}:${win}`;
      col.innerHTML = `<h4>${lab}</h4>`;
      col.appendChild(lineChart(pts, fmt, !!extra));
      charts.appendChild(col);
    });
  };
  card._draw(null);
  card._last = last || null;
  card._fmt = fmt;
  return card;
}

/* ---------- 組裝 ---------- */
function render() {
  if (!D) {
    document.getElementById("hero").innerHTML =
      '<div class="err">找不到 data.js。先跑一次 <code>python3 scripts/fetch_daily.py</code>。</div>';
    return;
  }

  document.getElementById("stamp").textContent =
    "資料產生於 " + (D.generated_at || "").replace("T", " ").slice(0, 16);

  const fx = D.fx_cadtwd;
  const cg = D.canadagold && D.canadagold.sell_cad ? D.canadagold : null;
  const tr = D.truney && D.truney.ok ? D.truney : null;

  const cgTwd = cg && fx ? cg.sell_cad * fx : null;
  const trCad = tr && fx ? tr.sell_twd / fx : null;

  /* HERO：同一枚金幣，兩邊差多少。匯率會被即時值覆蓋，所以包成函式重算。 */
  const hero = document.getElementById("hero");
  window.drawHero = () => {
  const fx = LIVE.fx || D.fx_cadtwd;
  const live = !!LIVE.fx;
  const cgSell = LIVE.cgSell || (cg && cg.sell_cad);
  const cgTwd = cgSell && fx ? cgSell * fx : null;
  const trCad = tr && fx ? tr.sell_twd / fx : null;
  if (cgTwd != null && tr) {
    const diff = tr.sell_twd - cgTwd;
    const pc = (diff / cgTwd) * 100;
    const cheaperTW = diff < 0;
    hero.innerHTML = `
      <div class="label">同一枚 1 oz 楓葉金幣 · 台灣 vs 加拿大</div>
      <div class="big ${cheaperTW ? "up" : "down"}">
        ${cheaperTW ? "台灣便宜" : "台灣貴"} ${twd(Math.abs(diff))}
        <span style="font-size:17px">(${pc >= 0 ? "+" : "−"}${Math.abs(pc).toFixed(1)}%)</span>
      </div>
      <div class="sub">換算匯率 CAD/TWD ${fx ? fx.toFixed(4) : "—"}${live ? "（即時）" : ""}</div>
      <div class="legs">
        <div class="leg"><div class="sub">台灣 truney</div><div class="v">${twd(tr.sell_twd)}</div></div>
        <div class="leg"><div class="sub">加拿大 Canada Gold</div><div class="v">${twd(cgTwd)}</div></div>
      </div>`;
  } else {
    const known = cgTwd != null
      ? `<div class="legs"><div class="leg"><div class="sub">加拿大 Canada Gold</div><div class="v">${twd(cgTwd)}</div></div>
         <div class="leg"><div class="sub">台灣 truney</div><div class="v" style="color:var(--muted)">待更新</div></div></div>`
      : "";
    hero.innerHTML = `
      <div class="label">同一枚 1 oz 楓葉金幣 · 台灣 vs 加拿大</div>
      <div class="big" style="font-size:24px;font-weight:600;color:var(--ink-2)">
        ${tr ? "缺 Canada Gold 或匯率資料，算不出價差" : "兩邊都有數字才算得出價差"}
      </div>
      <div class="sub">${tr ? "" : "按下面 truney 那格的「重新整理並讀取」"}</div>
      ${known}`;
  }
  };
  window.drawHero();

  /* 幣商兩張卡 */
  const dealers = document.getElementById("dealers");
  dealers.innerHTML = "";

  const cgCard = document.createElement("div");
  cgCard.className = "card";
  cgCard.dataset.id = "card:canadagold";
  cgCard.innerHTML = `
    <div class="label">Canada Gold 賣價</div>
    <div class="price">${cg ? cad(cg.sell_cad) : "—"}</div>
    <div class="alt">${cgTwd != null ? twd(cgTwd) : ""}</div>
    <div class="sub" style="margin-top:6px">${cg ? cg.product + " · " + cg.tier : ""}</div>
    <div class="rowend">
      <span class="dot ${cg ? "ok" : "bad"}"></span>
      <span class="sub">${cg ? "自動更新 · " + ago(cg.ts) : "抓取失敗"}</span>
    </div>`;
  dealers.appendChild(cgCard);

  const trCard = document.createElement("div");
  trCard.className = "card";
  trCard.dataset.id = "card:truney";
  const h = tr ? hoursSince(tr.page_loaded_at) : null;
  const cls = !tr ? "bad" : (h != null && h > 20 ? "stale" : "ok");
  const rawErr = (D.truney && D.truney.error) || "";
  // 完整的設定說明很長，塞在卡片裡會擠爆版面，收進 details 裡。
  const short = !tr
    ? (/JavaScript|AppleScript|Apple 事件/.test(rawErr) ? "Chrome 需要一次性設定"
       : /找不到/.test(rawErr) ? "Chrome 裡沒有開著 truney 分頁"
       : rawErr ? "讀取失敗" : "還沒讀到")
    : (h != null && h > 20 ? "分頁上的數字是舊的，按右邊更新" : "分頁載入於 " + ago(tr.page_loaded_at));
  trCard.innerHTML = `
    <div class="label">truney 賣價（台灣 · 數量 1）</div>
    <div class="price">${tr ? twd(tr.sell_twd) : "—"}</div>
    <div class="alt">${trCad != null ? cad(trCad) : ""}</div>
    <div class="sub" style="margin-top:6px">
      ${tr && tr.cash_twd != null && tr.original_twd != null
        ? `現金/電子錢包 ${twd(tr.cash_twd)} · 原價 ${twd(tr.original_twd)}
           <br>採用${tr.column === "cash" ? "現金價" : "原價"} · 從你開著的 Chrome 分頁讀取`
        : "從你開著的 Chrome 分頁讀取"}
    </div>
    <div class="rowend">
      <span class="dot ${cls}"></span>
      <span class="sub">${short}</span>
      <span class="spacer"></span>
      <button id="btn-truney">重新整理並讀取</button>
    </div>
    ${!tr && rawErr ? `<details class="sub" style="margin-top:10px"><summary style="cursor:pointer">怎麼修</summary><div style="margin-top:6px;line-height:1.6">${rawErr}</div></details>` : ""}`;
  dealers.appendChild(trCard);

  /* 四條有歷史的線 */
  const m = document.getElementById("metrics");
  m.innerHTML = "";
  const S = D.series || {};
  const THREE = [["近 1 個月", "1M"], ["近 3 個月", "3M"], ["近 1 年", "1Y"]];
  m.appendChild(metricBlock("gold", "金價現貨", S.gold, v => usd(v), "LBMA 上午定盤 · USD / 盎司", THREE, true));
  m.appendChild(metricBlock("tw0050", "0050", S.tw0050, v => "NT$" + nf(v, 2), "台股 ETF", THREE, true));
  m.appendChild(metricBlock("voo", "VOO", S.voo, v => usd(v), "S&P 500 ETF", THREE, true));
  m.appendChild(metricBlock("fx", "CAD / TWD", S.fx_cadtwd, v => nf(v, 4), "加拿大央行", THREE, true));
  m.appendChild(metricBlock("usdtwd", "USD / TWD", S.fx_usdtwd, v => nf(v, 4),
                            "加拿大央行 USD/CAD × CAD/TWD", THREE, true));

  /* 本益比：兩邊都沒有公開歷史序列，只能從今天累積，所以圖表等資料夠了才出現 */
  const peBox = document.getElementById("pe");
  peBox.innerHTML = "";
  const PE = D.pe || {};
  const calcNote = d => `<b>自行計算，非官方值。</b>以總市值 ÷ 總盈餘計算；
      納入 ${d.counted} / ${d.constituents} 檔，市值涵蓋 ${(d.coverage * 100).toFixed(1)}%。`;
  const peCards = [
    { key: "pe_tw0050", id: "pe:tw0050", title: "0050 本益比",
      value: PE.tw0050 && PE.tw0050.pe,
      note: PE.tw0050
        ? calcNote(PE.tw0050) + `證交所的本益比不含 ETF，成分股以市值前 50 大近似，
           未做自由流通調整。台積電一檔佔約五成，所以這是集中於半導體的估值，
           不代表台股整體。`
        : "尚未計算" },
    { key: "pe_twall", id: "pe:twall", title: "台股全市場 本益比",
      value: PE.twall && PE.twall.pe,
      note: PE.twall
        ? calcNote(PE.twall) + `涵蓋全部上市個股，與 S&P 500 屬同一層級，
           兩者相比才是「台股 vs 美股」。`
        : "尚未計算" },
    { key: "pe_sp500", id: "pe:sp500", title: "S&P 500 本益比",
      value: PE.sp500 && PE.sp500.pe,
      note: PE.sp500
        ? `來源 multpl.com，市場整體本益比，同為總量法。<br>資料時點：${PE.sp500.as_of || "—"}`
        : "尚未取得" },
  ];

  peCards.forEach(c => {
    const el = document.createElement("div");
    el.className = "card pe";
    el.dataset.id = c.id;
    const pts = (S[c.key] && S[c.key].points) || [];
    el.innerHTML = `
      <div class="label accent">${c.title}</div>
      <div class="v">${c.value != null ? nf(c.value, 2) : "—"}</div>
      <div class="why">${c.note}</div>`;
    if (pts.length >= 2) {
      const wrapEl = document.createElement("div");
      wrapEl.className = "charts";
      wrapEl.style.gridTemplateColumns = "1fr 1fr";
      [["近 1 個月", "1M"], ["近 3 個月", "3M"]].forEach(([lab, win]) => {
        const col = document.createElement("div");
        col.dataset.id = `chart:${c.key}:${win}`;
        col.innerHTML = `<h4>${lab}</h4>`;
        col.appendChild(lineChart(S[c.key][win], v => nf(v, 2)));
        wrapEl.appendChild(col);
      });
      el.appendChild(wrapEl);
    } else {
      const n = document.createElement("div");
      n.className = "sub";
      n.style.marginTop = "10px";
      n.textContent = `走勢從今天開始累積（目前 ${pts.length} 天）`;
      el.appendChild(n);
    }
    peBox.appendChild(el);
  });

  /* 熱力圖連結 */
  const hm = document.getElementById("heatmaps");
  hm.innerHTML = "";
  (D.heatmaps || []).forEach(h => {
    const a = document.createElement("a");
    a.className = "card tile";
    a.dataset.id = "heatmap:" + (h.sub || "");
    a.href = h.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.innerHTML = `<span><span class="label">${h.label}</span><br><span class="sub">${h.sub} · 在新分頁開啟</span></span><span class="arrow">↗</span>`;
    hm.appendChild(a);
  });

  /* 頁尾：來源狀態 */
  const st = (D.status && D.status.sources) || {};
  const names = { canadagold: "Canada Gold", gold: "LBMA 金價", tw0050: "證交所 0050", voo: "VOO", fx: "匯率" };
  const bad = Object.entries(st).filter(([, v]) => !v.ok);
  document.getElementById("foot").innerHTML =
    "來源：Canada Gold · LBMA · 臺灣證券交易所 · stockanalysis.com · 加拿大央行 · open.er-api.com"
    + (bad.length
        ? '<br><span class="err">抓取失敗：' + bad.map(([k, v]) => (names[k] || k) + "（" + v.error + "）").join("；") + "</span>"
        : "");

  wireButtons();
}

/* ---------- 按鈕 ---------- */
async function post(url, btn, working) {
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = working;
  try {
    const r = await fetch(url, { method: "POST" });
    const j = await r.json().catch(() => ({}));
    if (j.truney_ok === false && j.truney_error) {
      alert("其他來源都更新了，但 truney 沒成功：\n" + j.truney_error);
    }
    if (!r.ok || !j.ok) {
      btn.textContent = "失敗";
      alert((j.stderr || j.error || "失敗").trim());
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
      return;
    }
    location.reload();
  } catch (e) {
    btn.textContent = "伺服器沒開";
    alert("連不上本機伺服器。先跑 python3 scripts/serve.py，再從 http://127.0.0.1:8787/ 開這一頁。");
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1800);
  }
}

function wireButtons() {
  const t = document.getElementById("btn-truney");
  if (t) t.onclick = () => post("/api/refresh-truney", t, "更新中…");
}
document.getElementById("btn-all").onclick = e =>
  post("/api/refresh-all", e.currentTarget, "抓取中…");

/* ---------- 指點模式：按 D 開啟，點任一區塊複製它的代號 ---------- */
const pickmsg = document.getElementById("pickmsg");

document.addEventListener("keydown", e => {
  if (e.key !== "d" && e.key !== "D") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  // 擋掉瀏覽器或擴充功能（Vimium 等）對 d 的預設行為
  e.preventDefault();
  document.body.classList.toggle("pick");
  pickmsg.textContent = "";
}, true);

/* 點一個區塊 → 就地開輸入框寫意見，不用切回聊天視窗 */
const notebox = document.getElementById("notebox");
const noteText = document.getElementById("note-text");
const noteTarget = document.getElementById("note-target");
let currentTarget = null;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));

function openNote(el) {
  currentTarget = el.dataset.id;
  noteTarget.textContent = currentTarget;
  noteText.value = "";
  notebox.classList.add("on");

  // position:fixed，所以直接用視窗座標，不跟捲動耦合。
  // 上下界都要夾：視窗寬度在版面計算中途可能短暫是 0，
  // 只做 Math.min 會把框推到畫面外（left 變成負的）。
  const r = el.getBoundingClientRect();
  const W = window.innerWidth || document.documentElement.clientWidth || 360;
  const H = window.innerHeight || document.documentElement.clientHeight || 400;
  const box = notebox.getBoundingClientRect();
  const pad = 8;

  const fitsBelow = r.bottom + box.height + pad < H;
  const top = fitsBelow ? r.bottom + pad : r.top - box.height - pad;

  notebox.style.left = clamp(r.left, pad, Math.max(pad, W - box.width - pad)) + "px";
  notebox.style.top = clamp(top, pad, Math.max(pad, H - box.height - pad)) + "px";

  // preventScroll：否則瀏覽器會為了讓 textarea 進入視野而捲動頁面，
  // 把使用者剛才在看的區塊捲走。
  noteText.focus({ preventScroll: true });
}

function closeNote() {
  notebox.classList.remove("on");
  currentTarget = null;
}

async function sendNote() {
  const text = noteText.value.trim();
  if (!text || !currentTarget) return closeNote();
  const target = currentTarget;
  try {
    const r = await fetch("/api/note", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target, text, ts: new Date().toISOString() }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "送出失敗");
    pickmsg.innerHTML = `已送出 <code>${target}</code>`;
    closeNote();
    await loadNotes();
    // 送出後把清單攤開，讓使用者看到它確實躺在待處理裡，而不是閃一下就消失
    document.getElementById("notelist").classList.add("on");
  } catch (err) {
    alert("送不出去：" + err.message + "\n本機伺服器沒開的話，先跑 python3 scripts/serve.py");
  }
}

document.getElementById("note-send").onclick = sendNote;
noteText.addEventListener("keydown", e => {
  if (e.key === "Escape") { e.stopPropagation(); closeNote(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendNote(); }
});

document.addEventListener("click", e => {
  if (!document.body.classList.contains("pick")) return;
  if (e.target.closest("#notebox") || e.target.closest("#pickbar")) return;
  const el = e.target.closest("[data-id]");
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  openNote(el);
}, true);

/* 待處理意見的計數與清單 */
async function loadNotes() {
  let j;
  try {
    j = await (await fetch("/api/notes")).json();
  } catch { return; }
  const all = j.all || [];
  const open = j.open || [];
  const btn = document.getElementById("notecount");
  btn.textContent = open.length ? `${open.length} 則意見待處理` : "意見紀錄";
  btn.style.background = open.length ? "var(--warn)" : "var(--surface)";
  btn.style.color = open.length ? "#0b0b0b" : "var(--ink)";
  btn.style.border = open.length ? "none" : "1px solid var(--border)";
  btn.style.display = "";

  const esc = t => t.replace(/</g, "&lt;");
  const when = ts => {
    if (!ts) return "";
    const d = new Date(ts);
    return isNaN(d) ? "" : d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false });
  };
  const list = document.getElementById("notelist");
  const rows = all.slice().reverse().map(n => {
    const done = n.status === "done";
    return `<div class="n ${done ? "done" : ""}">
      <span class="st ${done ? "done" : "open"}">${done ? "已處理" : "待處理"}</span>
      <code>${esc(n.target)}</code>
      <span class="tx">${esc(n.text)}</span>
      <span class="when">${when(n.ts)}</span>
    </div>`;
  }).join("");

  list.innerHTML = (rows || '<div class="sub">還沒有任何意見</div>') + `
    <div class="hint">
      意見存在 <code>data/notes.jsonl</code>。<b>AI 不會自己發現它們</b> ——
      它只在你送訊息時才會執行。寫完之後回聊天視窗說一聲「看一下意見」即可，
      處理完這裡會變成「已處理」。
    </div>`;
}
document.getElementById("notecount").onclick = () =>
  document.getElementById("notelist").classList.toggle("on");

/* ---------- 即時報價 ----------
   三個來源的共同問題：走勢資料都是「收盤／定盤」，看的當下已經落後。
     0050  盤後 STOCK_DAY 停在昨天 → 證交所盤中報價
     金價  LBMA 一天一次定盤，實測跟現貨差到 2% → gold-api 現貨
     匯率  日更 API 固定在 00:02 UTC → fxratesapi 每分鐘
   拿到的值同時更新標題與折線圖的最後一點，末端畫一個實心點表示未定案。 */
const LIVE_KEYS = { tw0050: "metric:tw0050", gold: "metric:gold",
                    fx_cadtwd: "metric:fx", voo: "metric:voo",
                    fx_usdtwd: "metric:usdtwd" };
// 即時值集中放這裡，HERO 的台加價差要同時用到匯率與 Canada Gold 的報價
const LIVE = { fx: null, cgSell: null };
// 「是不是今天」要用該市場自己的時區判斷。美股 16:00 EDT 已經是台灣的隔天
// 凌晨，用台灣日期比對會把盤中的 VOO 誤判成舊資料。
const LIVE_TZ = { tw0050: "Asia/Taipei", voo: "America/New_York",
                  gold: "UTC", fx_cadtwd: "UTC", fx_usdtwd: "UTC" };

function applyLive(key, q) {
  const card = document.querySelector(`[data-id="${LIVE_KEYS[key]}"]`);
  if (!card || !q || !q.price) return;
  const now = card.querySelector('[data-role="now"]');
  const delta = card.querySelector('[data-role="delta"]');
  const asof = card.querySelector('[data-role="asof"]');
  if (!now) return;

  const today = new Date().toLocaleDateString("sv-SE", { timeZone: LIVE_TZ[key] || "UTC" });
  const isToday = q.date === today;
  const fmt = card._fmt || (v => v);

  // 基準：0050 有證交所給的昨收，其他兩個用序列裡最後一個收盤點
  const base = q.prev_close != null ? q.prev_close
             : (card._last ? card._last.v : null);

  now.textContent = fmt(q.price);
  if (base) {
    const dv = q.price - base, pc = dv / base * 100;
    delta.innerHTML = `<span class="${dv >= 0 ? "up" : "down"}">${dv >= 0 ? "▲" : "▼"} ` +
      `${fmt(Math.abs(dv))} (${pc >= 0 ? "+" : "−"}${Math.abs(pc).toFixed(2)}%)</span>`;
  }
  // 美股非一般時段時，顯示「下次開盤是台北時間幾點」比「某日收盤」有用。
  // next_open 由伺服器用 NYSE 日曆算出，已跳過週末與國定假日。
  const inSession = q.market_state ? q.market_state === "regular" : isToday;
  if (!inSession && q.next_open) {
    asof.textContent = `開盤：台北 ${q.next_open}`;
    asof.style.color = "";
  } else {
    asof.textContent = inSession
      ? `${q.kind || "即時"} ${q.time || ""}`
      : `${q.date || ""} ${q.kind || "收盤"}`;
    asof.style.color = inSession ? "var(--up)" : "";
  }

  // 只有盤中的價格才掛上折線圖。盤後延長時段的成交價不該蓋掉當天已經
  // 定案的收盤價 —— 圖是歷史，標題才是「現在」。
  if (card._draw) card._draw(inSession ? { d: q.date, v: q.price } : null);

  // 匯率換了，台加價差要跟著重算，否則 HERO 還在用日更的舊匯率
  if (key === "fx_cadtwd" && isToday) { LIVE.fx = q.price; if (window.drawHero) window.drawHero(); }
}

function applyCanadaGold(q) {
  const card = document.querySelector('[data-id="card:canadagold"]');
  if (!card || !q || !q.price) return;
  LIVE.cgSell = q.price;
  const fx = LIVE.fx || D.fx_cadtwd;
  card.querySelector(".price").textContent = cad(q.price);
  card.querySelector(".alt").textContent = fx ? twd(q.price * fx) : "";
  const stamp = card.querySelector(".rowend .sub");
  if (stamp) { stamp.textContent = "即時 · 重新整理頁面時更新"; stamp.style.color = "var(--up)"; }
  if (window.drawHero) window.drawHero();
}

async function pollLive() {
  try {
    const j = await (await fetch("/api/live")).json();
    const q = j.quotes || {};
    Object.keys(LIVE_KEYS).forEach(k => q[k] && applyLive(k, q[k]));
    if (q.canadagold) applyCanadaGold(q.canadagold);
  } catch { /* 伺服器沒開就維持收盤數字，不要吵使用者 */ }
}

pollLive();
setInterval(() => { if (!document.hidden) pollLive(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLive(); });

render();
loadNotes();
</script>
